<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚪 کرکره فولادی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f2744;--blue:#1e3a5f;--sky:#2d6a9f;--gold:#f59e0b;--go:#059669;--danger:#dc2626;--bg:#f0f4f8;--sur:#fff;--line:#dde3ec;--dim:#6b7a96}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--ink);direction:rtl}
.hdr{background:linear-gradient(135deg,var(--ink),var(--blue));padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(15,39,68,.18)}
.hdr h1{font-size:15px;font-weight:900;color:#fff}
.wrap{max-width:500px;margin:0 auto 90px;padding:12px 12px 0}
.card{background:var(--sur);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 4px 18px rgba(15,39,68,.08);border:1px solid var(--line)}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:300;box-shadow:0 -3px 16px rgba(15,39,68,.08)}
.nb{flex:1;padding:7px 0;border:none;background:none;cursor:pointer;font-family:inherit}
.nb .ni{font-size:18px}.nb .nl{font-size:9px;color:var(--dim);margin-top:1px}
.nb.active .nl{color:var(--blue);font-weight:700}
.nd{width:14px;height:3px;background:var(--blue);border-radius:2px;margin:2px auto 0;display:none}
.nb.active .nd{display:block}
.btn{border:none;border-radius:10px;padding:10px 16px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.btn:active{transform:scale(.97)}
.bp{background:var(--blue);color:#fff}.bg{background:var(--go);color:#fff}
.br{background:#fee2e2;color:var(--danger)}.bl{background:#f1f5f9;color:#334155}
.bwa{background:#25D366;color:#fff}.bsm{background:#3b82f6;color:#fff}
.bpr{background:var(--ink);color:#fff}.bpu{background:#7c3aed;color:#fff}
.bfull{width:100%}.bbig{padding:14px;font-size:15px;border-radius:13px}
.lbl{display:block;font-size:11px;color:var(--dim);font-weight:600;margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;direction:rtl;outline:none;background:#f9fafb;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--sky);background:#fff;box-shadow:0 0 0 3px rgba(45,106,159,.1)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{display:none}
textarea{height:70px;resize:vertical}
.f{margin-bottom:10px}.r2{display:flex;gap:8px}.r2 .f{flex:1}
.st{font-weight:800;color:var(--blue);font-size:14px;margin-bottom:12px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sc{border-radius:13px;padding:13px;text-align:center}
.sc .si{font-size:24px}.sc .sv{font-weight:800;font-size:13px;margin-top:4px}.sc .sl{font-size:10px;color:var(--dim);margin-top:1px}
.ic{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:8px;cursor:pointer;transition:all .15s;box-shadow:0 2px 6px rgba(15,39,68,.04)}
.ic:hover{box-shadow:0 4px 14px rgba(15,39,68,.1);transform:translateY(-1px)}
.dtbl{width:100%;border-collapse:collapse;font-size:12px}
.dtbl thead th{padding:7px 5px;background:#f1f5f9;color:var(--dim);font-weight:700;font-size:10px;border-bottom:2px solid var(--line);text-align:right;white-space:nowrap}
.dtbl tbody tr{border-bottom:1px solid var(--line)}
.dtbl tbody tr:last-child{border-bottom:none}
.dtbl tbody td{padding:5px 4px;vertical-align:middle}
.dtbl tbody td input,.dtbl tbody td select{padding:7px 7px;font-size:12px;border-radius:7px}
.dtbl tfoot td{padding:7px 5px;font-size:11px;font-weight:700;background:#f8fafc;border-top:2px solid var(--line)}
.rt-grp{display:flex;gap:3px}
.rt-btn{flex:1;padding:6px 3px;border:1.5px solid var(--line);border-radius:7px;background:#f9fafb;cursor:pointer;font-family:inherit;font-size:10px;font-weight:700;white-space:nowrap;transition:all .15s}
.rt-btn.on{border-color:var(--blue);background:var(--blue);color:#fff}
.del-btn{width:26px;height:26px;border:none;border-radius:7px;background:#fee2e2;color:var(--danger);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;margin:auto}
.del-btn:disabled{opacity:.3;cursor:not-allowed}
.add-row{width:100%;margin-top:9px;padding:9px;border:1.5px dashed var(--line);border-radius:10px;background:#f9fafb;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:5px}
.add-row:hover{border-color:var(--sky);color:var(--sky);background:#f0f9ff}
.prod-sub{background:#fafbff;border-top:1px dashed var(--line)}
.prod-sub td{padding:5px 8px}
.sumbox{background:linear-gradient(135deg,var(--ink),var(--blue));border-radius:15px;padding:16px;color:#fff;margin-bottom:12px}
.srow{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;opacity:.82}
.stot{border-top:1px solid rgba(255,255,255,.2);margin-top:9px;padding-top:10px;font-size:18px;font-weight:900;text-align:center;color:var(--gold)}
.finbox{background:#f0fdf4;border:2px solid #bbf7d0;border-radius:13px;padding:15px;margin-bottom:12px}
.fr{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.ftot{border-top:1px solid #86efac;margin-top:7px;padding-top:8px;display:flex;justify-content:space-between;font-size:16px;font-weight:800}
.pi{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}
.badge{padding:3px 8px;border-radius:7px;font-size:10px;font-weight:700}
.bp2{background:#fef3c7;color:#92400e}.bd{background:#d1fae5;color:#065f46}
.sb{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px;direction:rtl;outline:none;margin-bottom:12px;background:#f9fafb}
.sb:focus{border-color:var(--sky)}
.empty{text-align:center;color:var(--dim);padding:40px 20px}
.empty .ei{font-size:40px;margin-bottom:8px}
.bbtn{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:12px;font-weight:600;background:none;border:none;cursor:pointer;margin-bottom:12px;font-family:inherit}
.addbox{border:1.5px dashed var(--line);border-radius:11px;padding:13px;background:#f9fafb;margin-top:8px}
.abt{font-weight:700;color:var(--dim);font-size:11px;margin-bottom:8px}
.vrow{display:flex;gap:6px;align-items:stretch}
.vrow input{flex:1;padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;direction:rtl;outline:none;background:#f0f9ff}
.micbtn{width:42px;min-width:42px;border-radius:9px;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;position:relative;overflow:hidden}
.micbtn.rec{background:var(--danger)}
.rpl{position:absolute;width:100%;height:100%;border-radius:9px;background:rgba(255,255,255,.25);animation:rip .8s infinite}
@keyframes rip{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.3);opacity:0}}
.rst{text-align:center;padding:6px;border-radius:8px;font-size:11px;font-weight:600;margin-top:6px}
.rst.rec{background:#fef2f2;color:var(--danger)}
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;right:0;left:0;background:#fff;border:1.5px solid var(--sky);border-radius:10px;box-shadow:0 8px 24px rgba(15,39,68,.15);z-index:500;max-height:220px;overflow-y:auto;margin-top:3px}
.ac-item{padding:10px 13px;cursor:pointer;border-bottom:1px solid var(--line)}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.sel{background:#eff6ff}
.cfg-card{background:var(--sur);border-radius:18px;margin-bottom:12px;box-shadow:0 4px 18px rgba(15,39,68,.08);border:1px solid var(--line);overflow:hidden}
.cfg-nav{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;background:#f1f5f9;border-bottom:2px solid var(--line)}
.ctab{border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:10px;font-weight:700;color:var(--dim);padding:10px 4px;text-align:center;line-height:1.5;border-bottom:3px solid transparent}
.ctab.on{color:var(--blue);border-bottom:3px solid var(--blue);background:#fff}
.cfg-body{padding:16px}
.prod-card{background:#fff;border:2px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 8px rgba(15,39,68,.06)}
.prod-card.done{border-color:#bbf7d0}
.prod-hdr{padding:11px 14px;display:flex;justify-content:space-between;align-items:center}
.prod-hdr.pending{background:linear-gradient(135deg,var(--ink),var(--blue))}
.prod-hdr.done{background:linear-gradient(135deg,#059669,#047857)}
.ptbl{width:100%;border-collapse:collapse;font-size:11px}
.ptbl th{background:#f1f5f9;padding:6px 4px;text-align:center;font-size:10px;font-weight:700;color:var(--dim);border:1px solid var(--line);white-space:nowrap}
.ptbl td{padding:6px 4px;text-align:center;border:1px solid var(--line);font-size:11px}
.ptbl tr:nth-child(even) td{background:#f9fafb}
.fin{animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="hdr">
  <h1>🚪 کرکره فولادی</h1>
  <div style="color:rgba(255,255,255,.6);font-size:11px" id="hdrDate"></div>
</div>
<div class="wrap" id="app"></div>
<nav class="bnav">
  <button class="nb active" data-page="home" onclick="go('home')"><div class="ni">🏠</div><div class="nl">خانه</div><div class="nd"></div></button>
  <button class="nb" data-page="new"  onclick="go('new')"> <div class="ni">➕</div><div class="nl">فاکتور جدید</div><div class="nd"></div></button>
  <button class="nb" data-page="list" onclick="go('list')"><div class="ni">📋</div><div class="nl">فاکتورها</div><div class="nd"></div></button>
  <button class="nb" data-page="prod" onclick="go('prod')"><div class="ni">🏭</div><div class="nl">تولید</div><div class="nd"></div></button>
  <button class="nb" data-page="cfg"  onclick="go('cfg')"> <div class="ni">⚙️</div><div class="nl">تنظیمات</div><div class="nd"></div></button>
</nav>
<script>
/* ════ DATA ════ */
var DEF = {
  products:[
    {id:"p1",name:"تک‌جداره ساده",    ppm:850000},
    {id:"p2",name:"تک‌جداره فول‌پانچ", ppm:950000},
    {id:"p3",name:"دوجداره ساده",      ppm:1150000},
    {id:"p4",name:"دوجداره عایق‌دار",  ppm:1350000},
    {id:"p5",name:"ضدسرقت",            ppm:1550000}
  ],
  colors:[
    {id:"c1",name:"سفید"},{id:"c2",name:"کرم"},{id:"c3",name:"خاکستری"},
    {id:"c4",name:"مشکی"},{id:"c5",name:"قهوه‌ای"},{id:"c6",name:"آجری"}
  ],
  accTypes:[
    {id:"a1",name:"ریل",    unit:"متر",ppu:120000},
    {id:"a2",name:"تبدیل", unit:"عدد",ppu:85000},
    {id:"a3",name:"شفت",   unit:"متر",ppu:95000}
  ],
  fixedNotes:["کالا پس از تحویل مرجوع نمی‌شود.","نصب به عهده خریدار می‌باشد.","ضمانت: ۱۲ ماه در برابر عیوب ساخت."]
};

var P    = ld("kk9_p")    || DEF;
var INV  = ld("kk9_i")    || [];
var PROD = ld("kk9_prod") || [];
if(!P.fixedNotes) P.fixedNotes = [];

var PAGE="home", SEL=null, CTAB2="products", Q="";
var DOORS=[], ACCS=[];

function ld(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function sv(){
  localStorage.setItem("kk9_p",    JSON.stringify(P));
  localStorage.setItem("kk9_i",    JSON.stringify(INV));
  localStorage.setItem("kk9_prod", JSON.stringify(PROD));
}
function nextN(){
  var nums = INV.map(function(i){return parseInt(i.num)||0});
  return (Math.max.apply(null,[0].concat(nums))+1).toString().padStart(4,"0");
}
function nowFa(){return new Date().toLocaleDateString("fa-IR")}
function fp(n){return (n||0).toLocaleString("fa-IR")+" تومان"}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function gv(id){var e=document.getElementById(id);return e?e.value:""}
function nd(){return{id:uid(),pid:"",cid:"",rt:"",rc:0,pc:0,nt:"",rcol:"",et:"galv",ecol:"",oc:"تولید"}}
function na(){return{id:uid(),aid:"",qty:""}}

/* ════ CALC ════ */
function calcTotals(doors,accs){
  var dt=0;
  for(var i=0;i<doors.length;i++){
    var d=doors[i];
    var pr=findById(P.products,d.pid);
    var a=(parseFloat(d.w)||0)*(parseFloat(d.h)||0);
    dt+=a*(pr?pr.ppm:0);
  }
  var at=0;
  for(var j=0;j<accs.length;j++){
    var a2=accs[j];
    var tp=findById(P.accTypes,a2.aid);
    at+=(parseFloat(a2.qty)||0)*(tp?tp.ppu:0);
  }
  return{dt:dt,at:at,tot:dt+at};
}
function findById(arr,id){
  for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}
  return null;
}
function calcTiles(h){return Math.round((parseFloat(h)||0)*100/7.5)}
function calcRailLen(h){return Math.max(0,((parseFloat(h)||0)*100-30)/100)}
function calcWCut(w){return Math.round((parseFloat(w)||0)*100)-5}
function pkgInfo(tiles,w){
  var perPkg = (parseFloat(w)||0)>=4 ? 11 : 13;
  var full = Math.floor(tiles/perPkg);
  var rem  = tiles % perPkg;
  var parts=[];
  for(var i=0;i<full;i++) parts.push(String(perPkg));
  if(rem>0) parts.push("("+rem+"+1)");
  else if(parts.length>0) parts[parts.length-1]="("+perPkg+"+1)";
  return {str:parts.join("+"), count:full+(rem>0?1:0)};
}

/* ════ NAVIGATE ════ */
function go(page,id){
  PAGE=page; SEL=id||null;
  document.querySelectorAll(".nb").forEach(function(b){b.classList.toggle("active",b.dataset.page===page);});
  if(page==="new"){DOORS=[nd()];ACCS=[na()];}
  render();
}

/* ════ RENDER ════ */
function render(){
  var app=document.getElementById("app");
  var d=document.createElement("div");
  d.className="fin";
  if(PAGE==="home")   d.innerHTML=pgHome();
  else if(PAGE==="new")    d.innerHTML=pgNew();
  else if(PAGE==="list")   d.innerHTML=pgList();
  else if(PAGE==="detail") d.innerHTML=pgDetail();
  else if(PAGE==="prod")   d.innerHTML=pgProd();
  else if(PAGE==="cfg")    d.innerHTML=pgCfg();
  app.innerHTML="";
  app.appendChild(d);
  afterRender();
}

/* ════ HOME ════ */
function pgHome(){
  var tR=INV.reduce(function(s,i){return s+(i.c?i.c.tot:0);},0);
  var tP=INV.reduce(function(s,i){return s+(i.pays?i.pays.reduce(function(ss,p){return ss+p.amt;},0):0);},0);
  var phones={};
  INV.forEach(function(i){if(i.cust&&i.cust.ph)phones[i.cust.ph]=1;});
  var cu=Object.keys(phones).length;
  var recent=[].concat(INV).reverse().slice(0,4).map(iCard).join("");
  var html='<div class="sgrid">';
  html+='<div class="sc" style="background:#eff6ff;border:1px solid #bfdbfe"><div class="si">📄</div><div class="sv" style="color:var(--blue)">'+INV.length+'</div><div class="sl">فاکتور</div></div>';
  html+='<div class="sc" style="background:#f0fdf4;border:1px solid #bbf7d0"><div class="si">👥</div><div class="sv" style="color:var(--go)">'+cu+'</div><div class="sl">مشتری</div></div>';
  html+='<div class="sc" style="background:#fffbeb;border:1px solid #fde68a"><div class="si">💰</div><div class="sv" style="color:#b45309;font-size:11px">'+fp(tR)+'</div><div class="sl">کل فروش</div></div>';
  html+='<div class="sc" style="background:#fef2f2;border:1px solid #fecaca"><div class="si">⚠️</div><div class="sv" style="color:var(--danger);font-size:11px">'+fp(tR-tP)+'</div><div class="sl">مانده کل</div></div>';
  html+='</div>';
  html+='<button class="btn bp bfull bbig" onclick="go(\'new\')">➕ ثبت فاکتور جدید</button>';
  if(INV.length) html+='<div style="margin-top:12px"><div class="st" style="margin-bottom:8px">📋 آخرین فاکتورها</div>'+recent+'</div>';
  return html;
}
function iCard(inv){
  var paid=inv.pays?inv.pays.reduce(function(s,p){return s+p.amt;},0):0;
  var rem=inv.c.tot-paid;
  return '<div class="ic" onclick="go(\'detail\',\''+inv.id+'\')">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
    +'<span style="font-weight:800;color:var(--blue);font-size:13px">فاکتور #'+inv.num+'</span>'
    +'<span style="font-size:10px;color:var(--dim)">📅 '+inv.date+'</span></div>'
    +'<div style="font-size:12px;margin-bottom:3px">👤 '+inv.cust.nm+' | 📱 '+inv.cust.ph+'</div>'
    +'<div style="font-size:11px;color:var(--dim);margin-bottom:5px">🚪 '+(inv.doors?inv.doors.length:0)+' دهنه</div>'
    +'<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700">'
    +'<span style="color:var(--go)">پرداخت: '+fp(paid)+'</span>'
    +'<span style="color:'+(rem>0?'var(--danger)':'var(--go)')+'">مانده: '+fp(rem)+'</span></div></div>';
}

/* ════ NEW INVOICE ════ */
function pgNew(){
  var dRows=DOORS.map(function(d,i){return doorRow(d,i);}).join("");
  var aRows=ACCS.map(function(a,i){return accRow(a,i);}).join("");
  var html='';
  // Voice
  html+='<div class="card"><div class="st">🎙️ ورودی صوتی</div>';
  html+='<div style="font-size:11px;color:var(--dim);margin-bottom:9px;line-height:1.7">دکمه میکروفون را بزنید و مشخصات درب را بگویید.</div>';
  html+='<div class="vrow"><input id="voiceOut" placeholder="گفتار شما اینجا نوشته می‌شود..." style="background:#f0f9ff">';
  html+='<button id="micbtn" class="micbtn" onclick="toggleRec()" title="ضبط صدا">🎙️</button></div>';
  html+='<div id="recStatus"></div></div>';
  // Customer
  html+='<div class="card"><div class="st">👤 مشتری</div><div class="r2">';
  html+='<div class="f"><label class="lbl">نام و نام‌خانوادگی</label><div class="ac-wrap" id="cnWrap">';
  html+='<input id="f_cn" placeholder="نام مشتری..." autocomplete="off" oninput="acSearch(this.value)" onfocus="acSearch(this.value)">';
  html+='<div class="ac-list" id="acList" style="display:none"></div></div></div>';
  html+='<div class="f"><label class="lbl">موبایل</label><input id="f_cp" type="tel" placeholder="۰۹۱۲..." inputmode="numeric"></div></div>';
  html+='<div class="f"><label class="lbl">📅 تاریخ فاکتور</label><input id="f_date" value="'+nowFa()+'"></div></div>';
  // Doors table
  html+='<div class="card" style="overflow-x:auto"><div class="st">🚪 سازه — دهانه‌های درب</div>';
  html+='<table class="dtbl"><thead><tr>';
  html+='<th>#</th><th>محصول</th><th>رنگ</th><th>نصب رول</th><th>عرض م</th><th>ارتفاع م</th><th>متراژ</th><th>مبلغ(ت)</th><th></th>';
  html+='</tr></thead><tbody id="dTb">'+dRows+'</tbody>';
  html+='<tfoot><tr><td colspan="6" style="text-align:right;color:var(--dim)">جمع سازه</td>';
  html+='<td id="ft_da"></td><td id="ft_dp" colspan="2"></td></tr></tfoot></table>';
  html+='<button class="add-row" onclick="addDoor()">➕ دهانه جدید</button></div>';
  // Accessories table
  html+='<div class="card" style="overflow-x:auto"><div class="st">🔧 متعلقات</div>';
  html+='<table class="dtbl"><thead><tr><th>#</th><th>نوع</th><th>مقدار</th><th>واحد</th><th>مبلغ(ت)</th><th></th></tr></thead>';
  html+='<tbody id="aTb">'+aRows+'</tbody>';

/* ════ DOOR HELPERS ════ */
function dSel(did,key,val){
  for(var i=0;i<DOORS.length;i++){if(DOORS[i].id===did){DOORS[i][key]=val;break;}}
  if(key==='rt'){
    var row=document.getElementById("dr_"+did);
    if(row){
      var btns=row.querySelectorAll('.rt-btn');
      for(var i=0;i<btns.length;i++){
        btns[i].classList.toggle('on',(btns[i].textContent==='داخل'&&val==='in')||(btns[i].textContent==='بیرون'&&val==='out'));
      }
    }
  }
  refDR(did); updSum();
}
function dSync(did){
  for(var i=0;i<DOORS.length;i++){
    if(DOORS[i].id===did){
      DOORS[i].w=gv("dw_"+did)||DOORS[i].w;
      DOORS[i].h=gv("dh_"+did)||DOORS[i].h;
      break;
    }
  }
  refDR(did); updSum();
}
function refDR(did){
  var d=null;
  for(var i=0;i<DOORS.length;i++){if(DOORS[i].id===did){d=DOORS[i];break;}}
  if(!d) return;
  var w=parseFloat(gv("dw_"+did)||d.w)||0;
  var h=parseFloat(gv("dh_"+did)||d.h)||0;
  var a=w*h;
  var pr=findById(P.products,gv("dp_"+did)||d.pid);
  var price=a*(pr?pr.ppm:0);
  var da=document.getElementById("da_"+did);
  var dp2=document.getElementById("dp2_"+did);
  if(da) da.textContent=a>0?a.toFixed(2)+' م²':'—';
  if(dp2) dp2.textContent=price>0?price.toLocaleString("fa-IR"):'—';
  var tiles=calcTiles(h);
  var rc=parseInt(gv("drc_"+did)||d.rc)||0;
  var pc=parseInt(gv("dpc_"+did)||d.pc)||0;
  var plain=Math.max(0,tiles-rc-pc-1);
  var calc=document.getElementById("dcalc_"+did);
  if(calc&&tiles>0) calc.textContent='تیغه: '+tiles+' | ساده: '+plain+' | پانچ: '+pc+' | رنگ: '+rc;
}
function addDoor(){
  var d=nd(); DOORS.push(d);
  var tbody=document.getElementById("dTb"); if(!tbody) return;
  var tmp=document.createElement("tbody");
  tmp.innerHTML=doorRow(d,DOORS.length-1);
  while(tmp.firstChild) tbody.appendChild(tmp.firstChild);
  updSum();
}
function delDoor(did){
  if(DOORS.length===1) return;
  DOORS=DOORS.filter(function(d){return d.id!==did;});
  var r1=document.getElementById("dr_"+did); if(r1) r1.remove();
  var r2=document.getElementById("dr2_"+did); if(r2) r2.remove();
  var rows=document.querySelectorAll("#dTb tr[id^='dr_']");
  for(var i=0;i<rows.length;i++){
    var cells=rows[i].querySelectorAll("td");
    if(cells[0]) cells[0].textContent=i+1;
  }
  updSum();
}
function aSel(aid,val){
  for(var i=0;i<ACCS.length;i++){if(ACCS[i].id===aid){ACCS[i].aid=val;break;}}
  var tp=findById(P.accTypes,val);
  var u=document.getElementById("au_"+aid); if(u) u.textContent=tp?tp.unit:'';
  refAR(aid); updSum();
}
function aSync(aid){
  for(var i=0;i<ACCS.length;i++){if(ACCS[i].id===aid){ACCS[i].qty=gv("aq_"+aid)||ACCS[i].qty;break;}}
  refAR(aid); updSum();
}
function refAR(aid){
  var a=null;
  for(var i=0;i<ACCS.length;i++){if(ACCS[i].id===aid){a=ACCS[i];break;}}
  if(!a) return;
  var tp=findById(P.accTypes,gv("aa_"+aid)||a.aid);
  var price=(parseFloat(gv("aq_"+aid)||a.qty)||0)*(tp?tp.ppu:0);
  var ap=document.getElementById("ap_"+aid);
  if(ap) ap.textContent=price>0?price.toLocaleString("fa-IR"):'—';
}
function addAcc(){
  var a=na(); ACCS.push(a);
  var tbody=document.getElementById("aTb"); if(!tbody) return;
  var tmp=document.createElement("tbody");
  tmp.innerHTML=accRow(a,ACCS.length-1);
  while(tmp.firstChild) tbody.appendChild(tmp.firstChild);
  updSum();
}
function delAcc(aid){
  if(ACCS.length===1) return;
  ACCS=ACCS.filter(function(a){return a.id!==aid;});
  var r=document.getElementById("ar_"+aid); if(r) r.remove();
  var rows=document.querySelectorAll("#aTb tr");
  for(var i=0;i<rows.length;i++){
    var cells=rows[i].querySelectorAll("td");
    if(cells[0]) cells[0].textContent=i+1;
  }
  updSum();
}
function updSum(){
  var doors=DOORS.map(function(d){
    return{pid:gv("dp_"+d.id)||d.pid,w:gv("dw_"+d.id)||d.w,h:gv("dh_"+d.id)||d.h};
  });
  var accs=ACCS.map(function(a){return{aid:gv("aa_"+a.id)||a.aid,qty:gv("aq_"+a.id)||a.qty};});
  var cl=calcTotals(doors,accs);
  function set(id,v){var e=document.getElementById(id);if(e)e.textContent=v;}
  set("s_dt",fp(cl.dt)); set("s_at",fp(cl.at)); set("s_tot",fp(cl.tot));
  var tA=doors.reduce(function(s,d){return s+(parseFloat(d.w)||0)*(parseFloat(d.h)||0);},0);
  set("ft_da",tA>0?tA.toFixed(2)+' م²':'');
  set("ft_dp",cl.dt>0?cl.dt.toLocaleString("fa-IR"):'');
  set("ft_ap",cl.at>0?cl.at.toLocaleString("fa-IR"):'');
}

/* ════ SUBMIT ════ */
function subInv(){
  var cn=(gv("f_cn")||"").trim(), cp=(gv("f_cp")||"").trim();
  if(!cn||!cp){alert("لطفاً نام و موبایل مشتری را وارد کنید");return;}
  var doors=DOORS.map(function(d){
    var pid=gv("dp_"+d.id)||d.pid, cid=gv("dc_"+d.id)||d.cid;
    var w=gv("dw_"+d.id)||d.w, h=gv("dh_"+d.id)||d.h;
    var pr=findById(P.products,pid), col=findById(P.colors,cid);
    var a=(parseFloat(w)||0)*(parseFloat(h)||0);
    var rc=parseInt(gv("drc_"+d.id)||d.rc)||0;
    var pc=parseInt(gv("dpc_"+d.id)||d.pc)||0;
    var nt=gv("dnt_"+d.id)||d.nt||"";
    var rcol=gv("drc2_"+d.id)||d.rcol||"";
    var et=gv("det_"+d.id)||d.et||"galv";
    var ecol=gv("dec_"+d.id)||d.ecol||"";
    var oc=gv("doc_"+d.id)||d.oc||"تولید";
    var rcolName=findById(P.colors,rcol); rcolName=rcolName?rcolName.name:"";
    var ecolName=findById(P.colors,ecol); ecolName=ecolName?ecolName.name:"";
    var tiles=calcTiles(h);
    var railLen=calcRailLen(h);
    return{pid:pid,cid:cid,rt:d.rt,w:w,h:h,
      pname:pr?pr.name:"",colName:col?col.name:"",
      area:a,price:a*(pr?pr.ppm:0),
      rc:rc,pc:pc,nt:nt,rcol:rcol,rcolName:rcolName,
      et:et,ecol:ecol,ecolName:ecolName,oc:oc,
      tiles:tiles,railLen:railLen};
  });
  var accs=ACCS.map(function(a){
    var aid=gv("aa_"+a.id)||a.aid, qty=gv("aq_"+a.id)||a.qty;
    var tp=findById(P.accTypes,aid);
    return{aid:aid,qty:qty,aname:tp?tp.name:"",unit:tp?tp.unit:"",price:(parseFloat(qty)||0)*(tp?tp.ppu:0)};
  }).filter(function(a){return a.aid&&parseFloat(a.qty)>0;});
  var cl=calcTotals(doors,ACCS.map(function(a){return{aid:gv("aa_"+a.id)||a.aid,qty:gv("aq_"+a.id)||a.qty};}));
  var notes=gv("f_notes")||"";
  var fixedPart=P.fixedNotes.length?"\n\n📌 شرایط فروش:\n"+P.fixedNotes.map(function(n){return "• "+n;}).join("\n"):"";
  var inv={id:uid(),num:nextN(),date:gv("f_date")||nowFa(),
    cust:{nm:cn,ph:cp},doors:doors,accs:accs,
    notes:(notes+fixedPart).trim(),c:cl,pays:[],status:"pend"};
  INV.push(inv); sv();
  go("detail",inv.id);
}

/* ════ VOICE ════ */
var recog=null, REC="idle";
function toggleRec(){if(REC==="rec"){stopRec();return;}startRec();}
function startRec(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("لطفاً از Chrome استفاده کنید.");return;}
  recog=new SR(); recog.lang="fa-IR"; recog.interimResults=true; recog.continuous=false;
  recog.onstart=function(){
    REC="rec";
    var mb=document.getElementById("micbtn");
    if(mb){mb.className="micbtn rec";mb.innerHTML='<div class="rpl"></div>⏹';}
    var st=document.getElementById("recStatus");
    if(st){st.className="rst rec";st.textContent="🔴 در حال ضبط — کلیک کنید تا متوقف شود";}
  };
  recog.onresult=function(e){
    var txt="";
    for(var i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript;
    var vo=document.getElementById("voiceOut"); if(vo) vo.value=txt;
  };
  recog.onend=function(){
    REC="idle";
    var mb=document.getElementById("micbtn");
    if(mb){mb.className="micbtn";mb.innerHTML="🎙️";}
    var st=document.getElementById("recStatus"); if(st) st.textContent="";
  };
  recog.onerror=function(err){
    REC="idle";
    var mb=document.getElementById("micbtn");
    if(mb){mb.className="micbtn";mb.innerHTML="🎙️";}
    var st=document.getElementById("recStatus"); if(st) st.textContent="";
    if(err.error==="not-allowed") alert("دسترسی به میکروفون رد شد.\nروی 🔒 آدرس‌بار کلیک کنید و Microphone را Allow کنید.");
  };
  try{recog.start();}catch(e){REC="idle";}
}
function stopRec(){
  try{recog&&recog.stop();}catch(e){}
  REC="idle";
  var mb=document.getElementById("micbtn");
  if(mb){mb.className="micbtn";mb.innerHTML="🎙️";}
  var st=document.getElementById("recStatus"); if(st) st.textContent="";
}

/* ════ AUTOCOMPLETE ════ */
var acIdx=-1;
function getCusts(){
  var map={};
  INV.forEach(function(inv){
    var ph=inv.cust&&inv.cust.ph?inv.cust.ph:""; if(!ph) return;
    if(!map[ph]) map[ph]={nm:inv.cust.nm||"",ph:ph,count:0,lastDate:inv.date||""};
    map[ph].count++; map[ph].lastDate=inv.date||map[ph].lastDate;
  });
  return Object.values(map).sort(function(a,b){return b.count-a.count;});
}
function acSearch(val){
  var list=document.getElementById("acList"); if(!list) return;
  var all=getCusts(), q=val.trim();
  var fil=q.length===0?all:all.filter(function(c){return c.nm.includes(q)||c.ph.includes(q);});
  if(!fil.length){list.style.display="none";return;}
  acIdx=-1;
  list.innerHTML=fil.slice(0,8).map(function(c,i){
    return '<div class="ac-item" id="aci_'+i+'" onclick="acPick(\''+c.nm.replace(/'/g,"\\'")+"','"+c.ph+'\')"><div style="font-size:13px;font-weight:700;color:var(--ink)">'+c.nm+'</div><div style="font-size:11px;color:var(--dim)">📱 '+c.ph+'</div><div style="font-size:10px;color:var(--go)">📄 '+c.count+' فاکتور | '+c.lastDate+'</div></div>';
  }).join("");
  list.style.display="block";
}
function acPick(nm,ph){
  var e1=document.getElementById("f_cn"), e2=document.getElementById("f_cp");
  if(e1) e1.value=nm; if(e2) e2.value=ph; acClose();
}
function acClose(){var l=document.getElementById("acList");if(l)l.style.display="none";acIdx=-1;}

/* ════ AFTER RENDER ════ */
function afterRender(){
  var hd=document.getElementById("hdrDate"); if(hd) hd.textContent="📅 "+nowFa();
  document.addEventListener("click",function(e){if(!e.target.closest("#cnWrap"))acClose();},{once:true});

function addPay(id){
  var amt=parseFloat(document.getElementById("pamt")&&document.getElementById("pamt").value)||0;
  var note=document.getElementById("pnote")&&document.getElementById("pnote").value||"";
  if(!amt){alert("مبلغ را وارد کنید");return;}
  for(var i=0;i<INV.length;i++){
    if(INV[i].id===id){
      INV[i].pays=INV[i].pays||[];
      INV[i].pays.push({id:uid(),amt:amt,note:note,date:nowFa()});
      break;
    }
  }
  sv(); go("detail",id);
}

/* ════ PRODUCTION QUEUE ════ */
function addToProd(invId){
  for(var i=0;i<PROD.length;i++){if(PROD[i].invId===invId){alert("این فاکتور قبلاً در صف تولید است.");return;}}
  var inv=null; for(var i=0;i<INV.length;i++){if(INV[i].id===invId){inv=INV[i];break;}}
  if(!inv) return;
  PROD.push({id:uid(),invId:invId,invNum:inv.num,custNm:inv.cust.nm,date:nowFa(),doors:JSON.parse(JSON.stringify(inv.doors||[])),status:"pending"});
  sv();
  alert("✅ فاکتور #"+inv.num+" به لیست تولید اضافه شد.");
  go("detail",invId);
}
function removeFromProd(invId){
  if(!confirm("از لیست تولید حذف شود؟")) return;
  PROD=PROD.filter(function(p){return p.invId!==invId;});
  sv(); go("detail",invId);
}
function toggleProdStatus(pid){
  for(var i=0;i<PROD.length;i++){if(PROD[i].id===pid){PROD[i].status=PROD[i].status==="done"?"pending":"done";break;}}
  sv(); go("prod");
}
function removeFromProdById(pid){
  if(!confirm("از لیست تولید حذف شود؟")) return;
  PROD=PROD.filter(function(p){return p.id!==pid;});
  sv(); go("prod");
}

  var pending=PROD.filter(function(p){return p.status!=="done";});
  var done=PROD.filter(function(p){return p.status==="done";});
  var html='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
  html+='<div style="font-size:13px;font-weight:800;color:var(--blue)">🏭 لیست تولید</div>';

  html+='<button onclick="removeFromProdById(\''+p.id+'\')" style="background:rgba(220,38,38,.3);color:#fff;border:none;border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:13px">✕</button>';

  html+='<div style="overflow-x:auto">';

    var w=parseFloat(d.w)||0, h=parseFloat(d.h)||0;
    var wCut=Math.round(w*100)-5;
    var tiles=d.tiles||Math.round(h*100/7.5);
    var rc=parseInt(d.rc)||0, pc=parseInt(d.pc)||0;
    var plain=Math.max(0,tiles-rc-pc-1);
    var totalStr=plain+"+"+rc+"+"+pc+"+1";
    var railLen=(d.railLen!=null?d.railLen:Math.max(0,(h*100-30)/100)).toFixed(2);
    var pkg=pkgInfo(tiles,w);
    var hookName=d.rt==='in'?'قلاب کوچک':d.rt==='out'?'قلاب بزرگ':'—';
    var etName=d.et==='alum'?'آلومینیوم':'گالوانیزه';
    var rcolN=d.rcolName||d.colName||'-';
    var ecolN=d.ecolName||d.colName||'-';
    var odd=i%2===0;
    html+='<tr'+(odd?'':' style="background:#f9fafb"')+'>';
    html+='<td>'+(i+1)+'</td>';
    html+='<td style="font-weight:800;color:var(--blue)">D'+p.invNum+(i+1)+'</td>';
    html+='<td>'+(d.pname||'-')+'</td>';
    html+='<td>'+(d.colName||'-')+'</td>';
    html+='<td style="font-weight:900;font-size:13px;color:var(--blue)">'+wCut+'</td>';
    html+='<td style="font-weight:700;color:#7c3aed">'+totalStr+'</td>';
    html+='<td>'+(rc>0?rc:'—')+'</td>';
    html+='<td>'+(pc>0?pc:'—')+'</td>';
    html+='<td>'+ecolN+'</td>';
    html+='<td>'+etName+'</td>';
    html+='<td style="font-weight:700">'+railLen+'</td>';
    html+='<td>'+rcolN+'</td>';
    html+='<td>'+(d.oc||'تولید')+'</td>';
    html+='<td>'+hookName+'</td>';
    html+='<td style="font-weight:800;color:var(--go)">'+pkg.count+'</td>';
    html+='<td style="font-size:10px;color:#7c3aed">'+pkg.str+'</td>';
    html+='<td style="font-size:10px;color:var(--dim)">'+(d.nt||'—')+'</td>';
    html+='</tr>';
  }
  html+='</tbody></table></div></div>';
  return html;
}

function printProd(pid){

      +'<td>'+(pc>0?pc:'—')+'</td>'
      +'<td>'+(d.ecolName||d.colName||'-')+'</td>'

  var html='<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><title>برگه تولید #'+p.invNum+'</title>'

    +'.top{display:flex;justify-content:space-between;border-bottom:3px solid #0f2744;padding-bottom:10px;margin-bottom:12px}'
    +'.logo{font-size:17px;font-weight:900;color:#0f2744}.info{font-size:11px;color:#6b7a96;text-align:left;line-height:1.7}'
    +'table{width:100%;border-collapse:collapse}'
    +'thead th{background:#0f2744;color:#fff;padding:6px 3px;text-align:center;font-size:9px;font-weight:700;border:1px solid #1e3a5f;white-space:nowrap}'
    +'tbody td{padding:5px 3px;text-align:center;border:1px solid #dde3ec;font-size:10px}'
    +'tbody tr:nth-child(even){background:#f8fafc}'
    +'@media print{body{padding:6px}}</style></head><body>'
    +'<div class="top">'
    +'<div><div class="logo">🏭 برگه تولید — کرکره فولادی</div></div>'
    +'<div class="info"><div>فاکتور: <b>#'+p.invNum+'</b></div><div>مشتری: <b>'+p.custNm+'</b></div><div>تاریخ: <b>'+p.date+'</b></div></div>'
    +'</div>'
    +'<table><thead><tr>'
    +'<th>ردیف</th><th>شماره</th><th>نوع تیغه</th><th>رنگ تیغه</th>'
    +'<th>عرض برش<br>(سانت)</th><th>تعداد کل<br>(ساده+رنگ+پانچ+۱)</th>'
    +'<th>رنگ خاص</th><th>پانچ</th><th>رنگ انتهایی</th><th>نوع انتهایی</th>'
    +'<th>طول ریل<br>(متر)</th><th>رنگ ریل</th><th>کد سفارش</th>'

    +'<script>window.onload=function(){window.print();};<\/script></body></html>';
  var w=window.open("","_blank"); w.document.write(html); w.document.close();

/* ════ SETTINGS ════ */
function pgCfg(){
  var html='<div class="cfg-card"><div class="cfg-nav">';
  html+='<button class="ctab'+(CTAB2==='products'?' on':'')+'" data-tab="products" onclick="sCfg(\'products\')">📦<br>محصولات</button>';
  html+='<button class="ctab'+(CTAB2==='accTypes'?' on':'')+'" data-tab="accTypes" onclick="sCfg(\'accTypes\')">🔧<br>متعلقات</button>';
  html+='<button class="ctab'+(CTAB2==='colors'?' on':'')+'" data-tab="colors" onclick="sCfg(\'colors\')">🎨<br>رنگ‌ها</button>';
  html+='<button class="ctab'+(CTAB2==='fixed'?' on':'')+'" data-tab="fixed" onclick="sCfg(\'fixed\')">📌<br>توضیحات</button>';
  html+='</div><div class="cfg-body" id="cfgBody">'+cfgBody()+'</div></div>';
  html+='<div class="card"><div class="st">🖨️ چاپ صورتحساب</div>';
  html+='<div class="f"><label class="lbl">انتخاب فاکتور</label><select id="printSel"><option value="">-- انتخاب کنید --</option>';
  var rev=[].concat(INV).reverse();
  for(var i=0;i<rev.length;i++) html+='<option value="'+rev[i].id+'">فاکتور #'+rev[i].num+' — '+rev[i].cust.nm+' — '+rev[i].date+'</option>';
  html+='</select></div><button class="btn bg bfull bbig" onclick="doPrintSel()" style="margin-top:6px">🖨️ چاپ / PDF</button></div>';
  return html;
}
function sCfg(t){
  CTAB2=t;
  var b=document.getElementById("cfgBody"); if(b) b.innerHTML=cfgBody();
  document.querySelectorAll(".ctab").forEach(function(el){el.classList.toggle("on",el.dataset.tab===t);});
}
function cfgBody(){
  if(CTAB2==="products") return cfgProducts();
  if(CTAB2==="accTypes") return cfgAccTypes();
  if(CTAB2==="colors")   return cfgColors();
  if(CTAB2==="fixed")    return cfgFixed();
  return "";
}
function cfgProducts(){
  var html=P.products.map(function(it){
    return '<div class="card" style="padding:12px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center">'
      +'<div><div style="font-weight:700;font-size:13px">'+it.name+'</div><div style="color:var(--go);font-size:12px;margin-top:2px">'+fp(it.ppm)+' / م²</div></div>'
      +'<div style="display:flex;gap:5px"><button class="btn bl" style="padding:6px 10px" onclick="edProd(\''+it.id+'\')">✏️</button>'
      +'<button class="btn br" style="padding:6px 10px" onclick="delProd(\''+it.id+'\')">🗑️</button></div></div></div>';
  }).join("");
  html+='<div class="addbox"><div class="abt">➕ محصول جدید</div>'
    +'<div class="f"><label class="lbl">نام</label><input id="nPn" placeholder="نام محصول..."></div>'
    +'<div class="f"><label class="lbl">قیمت م² (تومان)</label><input type="number" inputmode="numeric" id="nPp" placeholder="۱۰۰۰۰۰۰"></div>'
    +'<button class="btn bp bfull" onclick="addProd()" style="margin-top:4px">➕ افزودن</button></div>';
  return html;
}
function cfgAccTypes(){
  var html='<div style="font-size:11px;color:var(--dim);background:#f0f9ff;border-radius:9px;padding:9px;margin-bottom:10px;line-height:1.7">💡 متعلقاتی که اینجا تعریف می‌کنید در فرم فاکتور قابل انتخاب هستند.</div>';
  html+=P.accTypes.map(function(a){
    return '<div class="card" style="padding:12px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center">'
      +'<div><div style="font-weight:700;font-size:13px">'+a.name+' <span style="color:var(--dim);font-weight:400;font-size:11px">('+a.unit+')</span></div>'
      +'<div style="color:var(--go);font-size:12px;margin-top:2px">'+fp(a.ppu)+' / '+a.unit+'</div></div>'
      +'<div style="display:flex;gap:5px"><button class="btn bl" style="padding:6px 10px" onclick="edAcc(\''+a.id+'\')">✏️</button>'
      +'<button class="btn br" style="padding:6px 10px" onclick="delAccType(\''+a.id+'\')">🗑️</button></div></div></div>';
  }).join("");
  html+='<div class="addbox"><div class="abt">➕ متعلقات جدید</div>'
    +'<div class="f"><label class="lbl">نام</label><input id="nAn" placeholder="موتور برقی، قفل..."></div>'
    +'<div class="r2"><div class="f"><label class="lbl">واحد</label><input id="nAu" placeholder="متر/عدد/کیلو"></div>'
    +'<div class="f"><label class="lbl">قیمت واحد (تومان)</label><input type="number" inputmode="numeric" id="nAp" placeholder="۱۰۰۰۰۰"></div></div>'
    +'<button class="btn bp bfull" onclick="addAccType()" style="margin-top:4px">➕ افزودن</button></div>';
  return html;
}
function cfgColors(){
  var html='<div style="font-size:11px;color:var(--dim);background:#f0f9ff;border-radius:9px;padding:9px;margin-bottom:10px;line-height:1.7">🎨 رنگ‌های تعریف‌شده در فرم فاکتور قابل انتخاب هستند.</div>';
  html+=P.colors.map(function(c){
    var cmap={"سفید":"#fff","کرم":"#f5f0e8","خاکستری":"#9ca3af","مشکی":"#1f2937","قهوه‌ای":"#92400e","آجری":"#b45309"};
    var bg=cmap[c.name]||"#e5e7eb";
    return '<div class="card" style="padding:11px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">'
      +'<div style="display:flex;align-items:center;gap:9px">'
      +'<div style="width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:'+bg+'"></div>'
      +'<span style="font-weight:600">🎨 '+c.name+'</span></div>'
      +'<div style="display:flex;gap:5px"><button class="btn bl" style="padding:6px 10px" onclick="edCol(\''+c.id+'\')">✏️</button>'
      +'<button class="btn br" style="padding:6px 10px" onclick="delCol(\''+c.id+'\')">🗑️</button></div></div>';
  }).join("");
  html+='<div class="addbox"><div class="abt">➕ رنگ جدید</div>'
    +'<div class="f"><label class="lbl">نام رنگ</label><input id="nCol" placeholder="نقره‌ای، لاکی..."></div>'
    +'<button class="btn bp bfull" onclick="addCol()">➕ افزودن</button></div>';
  return html;
}
function cfgFixed(){
  var html='<div style="font-size:11px;color:var(--dim);background:#fffbeb;border-radius:9px;padding:9px;margin-bottom:10px;line-height:1.7">📌 این توضیحات در پایین هر فاکتور درج می‌شود.</div>';
  html+=P.fixedNotes.map(function(n,i){
    return '<div class="card" style="padding:11px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px">'
      +'<span style="font-size:12px;flex:1">'+n+'</span>'
      +'<div style="display:flex;gap:5px;flex-shrink:0">'
      +'<button class="btn bl" style="padding:6px 10px" onclick="edFixed('+i+')">✏️</button>'
      +'<button class="btn br" style="padding:6px 10px" onclick="delFixed('+i+')">🗑️</button></div></div>';
  }).join("");
  html+='<div class="addbox"><div class="abt">➕ توضیح جدید</div>'
    +'<textarea id="nFixed" placeholder="متن توضیح..." style="height:60px"></textarea>'
    +'<button class="btn bp bfull" onclick="addFixed()" style="margin-top:6px">➕ افزودن</button></div>';
  return html;
}
function doPrintSel(){var id=document.getElementById("printSel")&&document.getElementById("printSel").value;if(!id){alert("یک فاکتور انتخاب کنید");return;}doPrint(id);}
function edProd(id){var r=findById(P.products,id);if(!r)return;var n=prompt("نام:",r.name);if(!n)return;var p=prompt("قیمت م²:",r.ppm);if(!p)return;r.name=n;r.ppm=parseFloat(p)||r.ppm;sv();sCfg(CTAB2);}
function delProd(id){if(!confirm("حذف شود؟"))return;P.products=P.products.filter(function(x){return x.id!==id;});sv();sCfg(CTAB2);}
function addProd(){var n=document.getElementById("nPn")&&document.getElementById("nPn").value;var p=parseFloat(document.getElementById("nPp")&&document.getElementById("nPp").value);if(!n||!p)return;P.products.push({id:"p"+uid(),name:n,ppm:p});sv();sCfg(CTAB2);}
function edAcc(id){var r=findById(P.accTypes,id);if(!r)return;var n=prompt("نام:",r.name);if(!n)return;var u=prompt("واحد:",r.unit);if(!u)return;var p=prompt("قیمت:",r.ppu);if(!p)return;r.name=n;r.unit=u;r.ppu=parseFloat(p)||r.ppu;sv();sCfg(CTAB2);}
function delAccType(id){if(!confirm("حذف شود؟"))return;P.accTypes=P.accTypes.filter(function(x){return x.id!==id;});sv();sCfg(CTAB2);}
function addAccType(){var n=document.getElementById("nAn")&&document.getElementById("nAn").value;var u=document.getElementById("nAu")&&document.getElementById("nAu").value;var p=parseFloat(document.getElementById("nAp")&&document.getElementById("nAp").value);if(!n||!u||!p)return;P.accTypes.push({id:"a"+uid(),name:n,unit:u,ppu:p});sv();sCfg(CTAB2);}
function edCol(id){var r=findById(P.colors,id);if(!r)return;var n=prompt("نام رنگ:",r.name);if(!n)return;r.name=n;sv();sCfg(CTAB2);}
function addCol(){var n=document.getElementById("nCol")&&document.getElementById("nCol").value;if(!n)return;P.colors.push({id:"c"+uid(),name:n});sv();sCfg(CTAB2);}
function delCol(id){if(!confirm("حذف شود؟"))return;P.colors=P.colors.filter(function(c){return c.id!==id;});sv();sCfg(CTAB2);}
function edFixed(i){var n=prompt("ویرایش:",P.fixedNotes[i]);if(n===null)return;P.fixedNotes[i]=n;sv();sCfg(CTAB2);}
function delFixed(i){if(!confirm("حذف شود؟"))return;P.fixedNotes.splice(i,1);sv();sCfg(CTAB2);}
function addFixed(){var n=document.getElementById("nFixed")&&document.getElementById("nFixed").value;if(n)n=n.trim();if(!n)return;P.fixedNotes.push(n);sv();sCfg(CTAB2);}

render();
</script>
