<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚪 کرکره فولادی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f2744;--blue:#1e3a5f;--sky:#2d6a9f;--gold:#f59e0b;--go:#059669;--danger:#dc2626;--bg:#f0f4f8;--sur:#fff;--line:#dde3ec;--dim:#6b7a96}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--ink);direction:rtl;min-height:100vh}
.hdr{background:linear-gradient(135deg,var(--ink),var(--blue));padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(15,39,68,.18)}
.hdr h1{font-size:15px;font-weight:900;color:#fff}
.hdr p{color:rgba(255,255,255,.55);font-size:10px}
.wrap{max-width:500px;margin:0 auto 90px;padding:12px 12px 0}
.card{background:var(--sur);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 4px 18px rgba(15,39,68,.08);border:1px solid var(--line)}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:300;box-shadow:0 -3px 16px rgba(15,39,68,.08)}
.nb{flex:1;padding:8px 0;border:none;background:none;cursor:pointer;font-family:inherit}
.nb .ni{font-size:20px}.nb .nl{font-size:9px;color:var(--dim);margin-top:1px}
.nb.on .nl{color:var(--blue);font-weight:700}
.nd{width:16px;height:3px;background:var(--blue);border-radius:2px;margin:2px auto 0;display:none}
.nb.on .nd{display:block}
.btn{border:none;border-radius:10px;padding:10px 16px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;cursor:not-allowed}
.bp{background:var(--blue);color:#fff}.bg{background:var(--go);color:#fff}
.br{background:#fee2e2;color:var(--danger)}.bl{background:#f1f5f9;color:#334155}
.bwa{background:#25D366;color:#fff}.bsm{background:#3b82f6;color:#fff}
.bpr{background:var(--ink);color:#fff}.bfull{width:100%}.bbig{padding:14px;font-size:15px;border-radius:13px}
.lbl{display:block;font-size:11px;color:var(--dim);font-weight:600;margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;direction:rtl;outline:none;background:#f9fafb;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--sky);background:#fff;box-shadow:0 0 0 3px rgba(45,106,159,.1)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{display:none}
textarea{height:70px;resize:vertical}
.f{margin-bottom:10px}.r2{display:flex;gap:8px}.r2 .f{flex:1}
.dtbl{width:100%;border-collapse:collapse;font-size:12px}
.dtbl thead th{padding:7px 5px;background:#f1f5f9;color:var(--dim);font-weight:700;font-size:10px;border-bottom:2px solid var(--line);text-align:right;white-space:nowrap}
.dtbl tbody tr{border-bottom:1px solid var(--line)}
.dtbl tbody tr:last-child{border-bottom:none}
.dtbl tbody td{padding:5px 4px;vertical-align:middle}
.dtbl tbody td input,.dtbl tbody td select{padding:7px 7px;font-size:12px;border-radius:7px}
.dtbl tfoot td{padding:7px 5px;font-size:11px;font-weight:700;background:#f8fafc;border-top:2px solid var(--line)}
.rtg{display:flex;gap:3px}
.rtb{flex:1;padding:6px 3px;border:1.5px solid var(--line);border-radius:7px;background:#f9fafb;cursor:pointer;font-family:inherit;font-size:10px;font-weight:700;white-space:nowrap;transition:all .15s}
.rtb.on{border-color:var(--blue);background:var(--blue);color:#fff}
.delbtn{width:26px;height:26px;border:none;border-radius:7px;background:#fee2e2;color:var(--danger);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;margin:auto}
.delbtn:disabled{opacity:.3;cursor:not-allowed}
.addbtn{width:100%;margin-top:9px;padding:9px;border:1.5px dashed var(--line);border-radius:10px;background:#f9fafb;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.addbtn:hover{border-color:var(--sky);color:var(--sky);background:#f0f9ff}
/* Settings — standalone card with grid tabs inside */
.cfg-card{background:var(--sur);border-radius:18px;margin-bottom:12px;box-shadow:0 4px 18px rgba(15,39,68,.08);border:1px solid var(--line)}
.cfg-nav{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;background:#f1f5f9;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:10}
.ctab{padding:10px 2px;border:none;background:transparent;color:var(--dim);font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;text-align:center;line-height:1.5;border-left:1px solid var(--line);transition:background .15s}
.ctab:first-child{border-left:none}
.ctab.on{background:var(--blue);color:#fff}
.cfg-body{padding:16px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sc{border-radius:13px;padding:13px;text-align:center}
.sc .si{font-size:24px}.sc .sv{font-weight:800;font-size:13px;margin-top:4px}.sc .sl{font-size:10px;color:var(--dim);margin-top:1px}
.ic{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:8px;cursor:pointer;transition:all .15s;box-shadow:0 2px 6px rgba(15,39,68,.04)}
.ic:hover{box-shadow:0 4px 14px rgba(15,39,68,.1);transform:translateY(-1px)}
.sumbox{background:linear-gradient(135deg,var(--ink),var(--blue));border-radius:15px;padding:16px;color:#fff;margin-bottom:12px}
.srow{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;opacity:.82}
.stot{border-top:1px solid rgba(255,255,255,.2);margin-top:9px;padding-top:10px;font-size:18px;font-weight:900;text-align:center;color:var(--gold)}
.finbox{background:#f0fdf4;border:2px solid #bbf7d0;border-radius:13px;padding:15px;margin-bottom:12px}
.fr{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.ftot{border-top:1px solid #86efac;margin-top:7px;padding-top:8px;display:flex;justify-content:space-between;font-size:16px;font-weight:800}
.pi{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;gap:6px}
.badge{padding:3px 8px;border-radius:7px;font-size:10px;font-weight:700}
.bpnd{background:#fef3c7;color:#92400e}.bdone{background:#d1fae5;color:#065f46}
.st{font-weight:800;color:var(--blue);font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:5px}
.empty{text-align:center;color:var(--dim);padding:30px 20px}
.empty .ei{font-size:36px;margin-bottom:8px}
.bbtn{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:12px;font-weight:600;background:none;border:none;cursor:pointer;margin-bottom:12px;font-family:inherit}
.addbox{border:1.5px dashed var(--line);border-radius:11px;padding:13px;background:#f9fafb;margin-top:8px}
.abt{font-weight:700;color:var(--dim);font-size:11px;margin-bottom:8px}
.sb{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px;direction:rtl;outline:none;margin-bottom:12px;background:#f9fafb}
.sb:focus{border-color:var(--sky)}
.chatbox{background:#f9fafb;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:9px;max-height:180px;overflow-y:auto;scroll-behavior:smooth}
.msg{margin-bottom:8px;display:flex;gap:6px;align-items:flex-start}
.msg.u{flex-direction:row-reverse}
.mb{padding:8px 12px;border-radius:12px;font-size:12px;line-height:1.6;max-width:82%}
.msg.ai .mb{background:var(--blue);color:#fff;border-bottom-right-radius:3px}
.msg.u .mb{background:#e2e8f0;color:var(--ink);border-bottom-left-radius:3px}
.mav{font-size:16px;flex-shrink:0;margin-top:2px}
.vrow{display:flex;gap:6px;align-items:stretch}
.vrow input{flex:1;padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;direction:rtl;outline:none;background:#f9fafb}
.vrow input:focus{border-color:var(--sky);background:#fff}
.micbtn{width:38px;min-width:38px;border-radius:9px;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;position:relative;overflow:hidden}
.micbtn.rec{background:var(--danger)}
.rpl{position:absolute;width:100%;height:100%;border-radius:9px;background:rgba(255,255,255,.25);animation:rip .8s infinite}
@keyframes rip{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.3);opacity:0}}
.typing span{display:inline-block;width:5px;height:5px;background:rgba(255,255,255,.7);border-radius:50%;margin:0 2px;animation:td .9s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes td{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.rst{text-align:center;padding:5px;border-radius:7px;font-size:11px;font-weight:600;margin-top:5px;background:#fef2f2;color:var(--danger)}
.info{font-size:12px;color:var(--dim);margin-bottom:10px;background:#f0f9ff;border-radius:9px;padding:10px;line-height:1.7;border-right:3px solid var(--sky)}
.cust-tag{display:inline-flex;align-items:center;gap:5px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--blue);margin-bottom:8px}
.fin{animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
/* customer autocomplete */
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;right:0;left:0;background:#fff;border:1.5px solid var(--sky);border-radius:10px;box-shadow:0 8px 24px rgba(15,39,68,.15);z-index:500;max-height:220px;overflow-y:auto;margin-top:3px}
.ac-item{padding:10px 13px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .12s;display:flex;flex-direction:column;gap:2px}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.sel{background:#eff6ff}
.ac-item .ac-name{font-size:13px;font-weight:700;color:var(--ink)}
.ac-item .ac-ph{font-size:11px;color:var(--dim)}
.ac-item .ac-badge{font-size:10px;color:var(--go);margin-top:1px}
</style>
</head>
<body>
<div class="hdr"><div><h1>🚪 کرکره فولادی</h1><p>سیستم هوشمند فاکتور</p></div><div style="color:rgba(255,255,255,.6);font-size:11px" id="hdrDate"></div></div>
<div class="wrap" id="app"></div>
<nav class="bnav">
  <button class="nb on" data-p="home" onclick="go('home')"><div class="ni">🏠</div><div class="nl">خانه</div><div class="nd"></div></button>
  <button class="nb" data-p="new"     onclick="go('new')"> <div class="ni">➕</div><div class="nl">فاکتور جدید</div><div class="nd"></div></button>
  <button class="nb" data-p="list"    onclick="go('list')"><div class="ni">📋</div><div class="nl">فاکتورها</div><div class="nd"></div></button>
  <button class="nb" data-p="custs"   onclick="go('custs')"><div class="ni">👥</div><div class="nl">مشتریان</div><div class="nd"></div></button>
  <button class="nb" data-p="cfg"     onclick="go('cfg')"> <div class="ni">⚙️</div><div class="nl">تنظیمات</div><div class="nd"></div></button>
</nav>
<script>
/* ══════════════════════ DATA */
const DEF={
  fixedNotes:[
    "کالا پس از تحویل مرجوع نمی‌شود.",
    "نصب به عهده خریدار می‌باشد.",
    "ضمانت: ۱۲ ماه در برابر عیوب ساخت.",
  ],
  products:[
    {id:"p1",name:"تک‌جداره ساده",    ppm:850000},
    {id:"p2",name:"تک‌جداره فول‌پانچ", ppm:950000},
    {id:"p3",name:"دوجداره ساده",      ppm:1150000},
    {id:"p4",name:"دوجداره عایق‌دار",  ppm:1350000},
    {id:"p5",name:"ضدسرقت",            ppm:1550000},
  ],
  colors:[{id:"c1",name:"سفید"},{id:"c2",name:"کرم"},{id:"c3",name:"خاکستری"},{id:"c4",name:"مشکی"},{id:"c5",name:"قهوه‌ای"},{id:"c6",name:"آجری"}],
  accTypes:[
    {id:"a1",name:"ریل",    unit:"متر",ppu:120000},
    {id:"a2",name:"تبدیل", unit:"عدد",ppu:85000},
    {id:"a3",name:"شفت",   unit:"متر",ppu:95000},
  ]
};
let P    = ld("kk8_p") || DEF;
let INV  = ld("kk8_i") || [];
let CUSTS= ld("kk8_c") || [];
let PAGE="home", SEL=null, CTAB="products", CSEL=null, Q="", QC="";
let CHAT=[], CHAT_IN="", AI_ON=false, REC="idle";
let DOORS=[], ACCS=[];

function ld(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
function sv(){
  localStorage.setItem("kk8_p",JSON.stringify(P));
  localStorage.setItem("kk8_i",JSON.stringify(INV));
  localStorage.setItem("kk8_c",JSON.stringify(CUSTS));
}
function nextN(){return(Math.max(0,...INV.map(i=>parseInt(i.num)||0))+1).toString().padStart(4,"0")}
function nextCN(){return(Math.max(0,...CUSTS.map(c=>parseInt(c.cnum)||0))+1).toString().padStart(4,"0")}
function nowFa(){return new Date().toLocaleDateString("fa-IR")}
function fp(n){return(n||0).toLocaleString("fa-IR")+" تومان"}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function elv(id){const e=document.getElementById(id);return e?e.value:null}
function nd(){return{id:uid(),pid:"",cid:"",rt:""}}
function na(){return{id:uid(),aid:"",qty:""}}

function getOrCreateCust(nm,ph){
  let c=CUSTS.find(x=>x.ph===ph);
  if(!c){c={id:uid(),cnum:nextCN(),nm,ph,date:nowFa()};CUSTS.push(c);sv();}
  return c;
}

/* ══════════════════════ CALC */
function calcTotals(doors,accs){
  const dt=doors.reduce((s,d)=>{
    const pr=P.products.find(p=>p.id===d.pid);
    return s+(parseFloat(d.w)||0)*(parseFloat(d.h)||0)*(pr?.ppm||0);
  },0);
  const at=accs.reduce((s,a)=>{
    const tp=P.accTypes.find(t=>t.id===a.aid);
    return s+(parseFloat(a.qty)||0)*(tp?.ppu||0);
  },0);
  return{dt,at,tot:dt+at};
}

/* ══════════════════════ NAV */
function go(page,id=null){
  PAGE=page; SEL=id;
  document.querySelectorAll(".nb").forEach(b=>b.classList.toggle("on",b.dataset.p===page));
  if(page==="new"){DOORS=[nd()];ACCS=[na()];CHAT=[];CHAT_IN="";AI_ON=false;REC="idle";}
  render();
}

/* ══════════════════════ RENDER */
function render(){
  const app=document.getElementById("app");
  const d=document.createElement("div");
  d.className="fin";
  d.innerHTML=
    PAGE==="home"   ? pgHome()  :
    PAGE==="new"    ? pgNew()   :
    PAGE==="list"   ? pgList()  :
    PAGE==="detail" ? pgDetail():
    PAGE==="custs"  ? pgCusts() :
    PAGE==="cdetail"? pgCDetail():
    PAGE==="cfg"    ? pgCfg()   : "";
  app.innerHTML="";
  app.appendChild(d);
  afterRender();
}

/* settings — only swap body, keep nav bar */
function reCfg(){
  const bodyEl=document.getElementById("cfgBody");
  if(bodyEl){
    // just swap body content
    bodyEl.innerHTML=cfgBody();
    // update tab active states
    document.querySelectorAll(".ctab").forEach(b=>b.classList.toggle("on",b.dataset.tab===CTAB));
  } else {
    // first render
    const app=document.getElementById("app");
    app.innerHTML="";
    const d=document.createElement("div");
    d.className="fin";
    d.innerHTML=pgCfg();
    app.appendChild(d);
  }
}
// separate function that returns only body content
function cfgBody(){
  const t=CTAB;
  if(t==="products") return cfgProducts();
  if(t==="accTypes") return cfgAccTypes();
  if(t==="colors")   return cfgColors();
  if(t==="print")    return cfgPrint();
  if(t==="fixed")    return cfgFixed();
  return "";
}

/* ══════════════════════ HOME */
function pgHome(){
  const tR=INV.reduce((s,i)=>s+(i.c?.tot||0),0);
  const tP=INV.reduce((s,i)=>s+(i.pays?.reduce((ss,p)=>ss+p.amt,0)||0),0);
  return`
  <div class="sgrid">
    <div class="sc" style="background:#eff6ff;border:1px solid #bfdbfe"><div class="si">📄</div><div class="sv" style="color:var(--blue)">${INV.length}</div><div class="sl">فاکتور</div></div>
    <div class="sc" style="background:#f0fdf4;border:1px solid #bbf7d0"><div class="si">👥</div><div class="sv" style="color:var(--go)">${CUSTS.length}</div><div class="sl">مشتری</div></div>
    <div class="sc" style="background:#fffbeb;border:1px solid #fde68a"><div class="si">💰</div><div class="sv" style="color:#b45309;font-size:11px">${fp(tR)}</div><div class="sl">کل فروش</div></div>
    <div class="sc" style="background:#fef2f2;border:1px solid #fecaca"><div class="si">⚠️</div><div class="sv" style="color:var(--danger);font-size:11px">${fp(tR-tP)}</div><div class="sl">مانده کل</div></div>
  </div>
  <button class="btn bp bfull bbig" onclick="go('new')">➕ ثبت فاکتور جدید</button>
  ${INV.length?`<div style="margin-top:12px"><div class="st" style="margin-bottom:8px">📋 آخرین فاکتورها</div>${[...INV].reverse().slice(0,3).map(iCard).join("")}</div>`:""}`;
}

function iCard(inv){
  const paid=inv.pays?.reduce((s,p)=>s+p.amt,0)||0, rem=inv.c.tot-paid;
  return`<div class="ic" onclick="go('detail','${inv.id}')">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <span style="font-weight:800;color:var(--blue);font-size:13px">فاکتور #${inv.num}</span>
      <span style="font-size:10px;color:var(--dim)">📅 ${inv.date}</span>
    </div>
    <div style="font-size:12px;margin-bottom:3px">👤 ${inv.cust?.nm} | 📱 ${inv.cust?.ph}</div>
    <div style="font-size:11px;color:var(--dim);margin-bottom:5px">🚪 ${inv.doors?.length||0} دهنه</div>
    <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700">
      <span style="color:var(--go)">پرداخت: ${fp(paid)}</span>
      <span style="color:${rem>0?'var(--danger)':'var(--go)'}">مانده: ${fp(rem)}</span>
    </div>
  </div>`;
}

/* ══════════════════════ NEW */
function pgNew(){
  const chatHtml=CHAT.length===0
    ?`<div style="text-align:center;color:var(--dim);padding:12px;font-size:12px">👋 مشخصات رو بگید تا فرم پر بشه</div>`
    :CHAT.map(m=>`<div class="msg ${m.r==='ai'?'ai':'u'}"><div class="mav">${m.r==='ai'?'🤖':'👤'}</div><div class="mb">${m.t}</div></div>`).join("")
    +(AI_ON?`<div class="msg ai"><div class="mav">🤖</div><div class="mb"><div class="typing"><span></span><span></span><span></span></div></div></div>`:"");

  const doorRows=DOORS.map((d,i)=>buildDoorTr(d,i+1,true)).join("");
  const accRows =ACCS.map((a,i) =>buildAccTr(a,i+1,true)).join("");

  return`
  <div class="card">
    <div class="st">🤖 منشی هوشمند</div>
    <div class="chatbox" id="chatbox">${chatHtml}</div>
    <div class="vrow" style="margin-top:8px">
      <input id="cin" placeholder="بنویسید یا میکروفون...">
      <button id="micbtn" class="micbtn${REC==='rec'?' rec':''}" onclick="toggleRec()">${REC==='rec'?'<div class="rpl"></div>⏹':'🎙️'}</button>
      <button class="btn bp" style="padding:8px 12px;border-radius:9px;font-size:12px" onclick="sendChat()">ارسال</button>
    </div>
    ${REC==='rec'?`<div class="rst">🔴 در حال ضبط — کلیک کنید تا متوقف شود</div>`:''}
  </div>
  <div class="card">
    <div class="st">👤 مشتری</div>
    <div class="r2">
      <div class="f"><label class="lbl">نام و نام‌خانوادگی</label><div class="ac-wrap" id="cnWrap">
          <input id="f_cn" placeholder="نام مشتری..." autocomplete="off" oninput="acSearch(this.value)" onkeydown="acKey(event)" onfocus="acSearch(this.value)">
          <div class="ac-list" id="acList" style="display:none"></div>
        </div></div>
      <div class="f"><label class="lbl">موبایل</label><input id="f_cp" type="tel" placeholder="۰۹۱۲..." inputmode="numeric"></div>
    </div>

function buildDoorTr(d,num,editable){
  const pOpts=P.products.map(p=>`<option value="${p.id}"${d.pid===p.id?" selected":""}>${p.name}</option>`).join("");
  const cOpts=P.colors.map(c=>`<option value="${c.id}"${d.cid===c.id?" selected":""}>${c.name}</option>`).join("");
  const pr=P.products.find(p=>p.id===d.pid);
  const a=(parseFloat(d.w)||0)*(parseFloat(d.h)||0), price=a*(pr?.ppm||0);
  return`<tr id="dr_${d.id}">
    <td style="text-align:center;font-weight:800;color:var(--blue);font-size:11px;width:20px">${num}</td>
    <td style="min-width:110px"><select id="dp_${d.id}" onchange="dSel('${d.id}','pid',this.value)"><option value="">انتخاب...</option>${pOpts}</select></td>
    <td style="min-width:72px"><select id="dc_${d.id}" onchange="dSel('${d.id}','cid',this.value)"><option value="">رنگ...</option>${cOpts}</select></td>
    <td style="min-width:78px"><div class="rtg">
      <button class="rtb${d.rt==='in'?' on':''}" onclick="dSel('${d.id}','rt','in')">داخل</button>
      <button class="rtb${d.rt==='out'?' on':''}" onclick="dSel('${d.id}','rt','out')">بیرون</button>
    </div></td>
    <td style="width:66px"><input id="dw_${d.id}" type="number" inputmode="decimal" step="0.01" value="${d.w||''}" placeholder="عرض" onchange="dSync('${d.id}')"></td>
    <td style="width:66px"><input id="dh_${d.id}" type="number" inputmode="decimal" step="0.01" value="${d.h||''}" placeholder="ارتفاع" onchange="dSync('${d.id}')"></td>
    <td id="da_${d.id}" style="text-align:center;font-size:11px;font-weight:700;color:var(--sky);white-space:nowrap">${a>0?a.toFixed(2)+' م²':'—'}</td>
    <td id="dp2_${d.id}" style="text-align:left;font-size:11px;font-weight:700;color:var(--go);white-space:nowrap">${price>0?price.toLocaleString("fa-IR"):'—'}</td>
    <td><button class="delbtn" onclick="delDoor('${d.id}')"${DOORS.length===1?" disabled":""}>✕</button></td>
  </tr>`;
}
function buildAccTr(a,num){
  const tOpts=P.accTypes.map(t=>`<option value="${t.id}"${a.aid===t.id?" selected":""}>${t.name} (${t.unit})</option>`).join("");
  const tp=P.accTypes.find(t=>t.id===a.aid);
  const price=(parseFloat(a.qty)||0)*(tp?.ppu||0);
  return`<tr id="ar_${a.id}">
    <td style="text-align:center;font-weight:800;color:var(--blue);font-size:11px;width:20px">${num}</td>
    <td style="min-width:118px"><select id="aa_${a.id}" onchange="aSel('${a.id}',this.value)"><option value="">نوع متعلقات...</option>${tOpts}</select></td>
    <td style="width:86px"><input id="aq_${a.id}" type="number" inputmode="decimal" step="0.01" value="${a.qty||''}" placeholder="مقدار" onchange="aSync('${a.id}')"></td>
    <td id="au_${a.id}" style="font-size:11px;color:var(--dim);width:34px">${tp?.unit||''}</td>
    <td id="ap_${a.id}" style="text-align:left;font-size:11px;font-weight:700;color:var(--go);white-space:nowrap">${price>0?price.toLocaleString("fa-IR"):'—'}</td>
    <td><button class="delbtn" onclick="delAcc('${a.id}')"${ACCS.length===1?" disabled":""}>✕</button></td>
  </tr>`;
}

/* door/acc DOM helpers */
function dSel(did,key,val){
  DOORS=DOORS.map(d=>d.id===did?{...d,[key]:val}:d);
  if(key==='rt'){const row=document.getElementById("dr_"+did);if(row)row.querySelectorAll('.rtb').forEach(b=>b.classList.toggle('on',(b.textContent==='داخل'&&val==='in')||(b.textContent==='بیرون'&&val==='out')));}
  refreshDR(did); updSum();
}
function dSync(did){
  DOORS=DOORS.map(d=>d.id===did?{...d,w:elv("dw_"+did)||d.w,h:elv("dh_"+did)||d.h}:d);
  refreshDR(did); updSum();
}
function refreshDR(did){
  const d=DOORS.find(x=>x.id===did); if(!d) return;
  const w=parseFloat(elv("dw_"+did)||d.w)||0, h=parseFloat(elv("dh_"+did)||d.h)||0, a=w*h;
  const pr=P.products.find(p=>p.id===(elv("dp_"+did)||d.pid));
  const price=a*(pr?.ppm||0);
  const da=document.getElementById("da_"+did), dp2=document.getElementById("dp2_"+did);
  if(da) da.textContent=a>0?a.toFixed(2)+' م²':'—';
  if(dp2) dp2.textContent=price>0?price.toLocaleString("fa-IR"):'—';
}
function addDoor(){
  const d=nd(); DOORS.push(d);
  const tbody=document.getElementById("doorTbody"); if(!tbody) return;
  const tr=document.createElement("tr"); tr.id="dr_"+d.id;
  tr.innerHTML=buildDoorTr(d,DOORS.length,true).replace(/^<tr[^>]*>/,'').replace(/<\/tr>$/,'');
  tbody.appendChild(tr); updSum();
}
function delDoor(did){
  if(DOORS.length===1) return;
  DOORS=DOORS.filter(d=>d.id!==did);
  document.getElementById("dr_"+did)?.remove();
  document.querySelectorAll("#doorTbody tr").forEach((tr,i)=>{const c=tr.querySelectorAll("td");if(c[0])c[0].textContent=i+1;});
  updSum();
}
function getUnit(aid){return P.accTypes.find(t=>t.id===aid)?.unit||''}
function aSel(aid,val){
  ACCS=ACCS.map(a=>a.id===aid?{...a,aid:val}:a);
  const u=document.getElementById("au_"+aid); if(u) u.textContent=getUnit(val);
  refreshAR(aid); updSum();
}
function aSync(aid){ACCS=ACCS.map(a=>a.id===aid?{...a,qty:elv("aq_"+aid)||a.qty}:a); refreshAR(aid); updSum();}
function refreshAR(aid){
  const a=ACCS.find(x=>x.id===aid); if(!a) return;
  const tp=P.accTypes.find(t=>t.id===(elv("aa_"+aid)||a.aid));
  const price=(parseFloat(elv("aq_"+aid)||a.qty)||0)*(tp?.ppu||0);
  const ap=document.getElementById("ap_"+aid); if(ap) ap.textContent=price>0?price.toLocaleString("fa-IR"):'—';
}
function addAcc(){
  const a=na(); ACCS.push(a);
  const tbody=document.getElementById("accTbody"); if(!tbody) return;
  const tr=document.createElement("tr"); tr.id="ar_"+a.id;
  tr.innerHTML=buildAccTr(a,ACCS.length).replace(/^<tr[^>]*>/,'').replace(/<\/tr>$/,'');
  tbody.appendChild(tr); updSum();
}
function delAcc(aid){
  if(ACCS.length===1) return;
  ACCS=ACCS.filter(a=>a.id!==aid);
  document.getElementById("ar_"+aid)?.remove();
  document.querySelectorAll("#accTbody tr").forEach((tr,i)=>{const c=tr.querySelectorAll("td");if(c[0])c[0].textContent=i+1;});
  updSum();
}
function updSum(){
  const doors=DOORS.map(d=>({...d,pid:elv("dp_"+d.id)||d.pid,w:elv("dw_"+d.id)||d.w,h:elv("dh_"+d.id)||d.h}));
  const accs=ACCS.map(a=>({...a,aid:elv("aa_"+a.id)||a.aid,qty:elv("aq_"+a.id)||a.qty}));
  const cl=calcTotals(doors,accs);
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  set("s_dt",fp(cl.dt)); set("s_at",fp(cl.at)); set("s_tot",fp(cl.tot));
  const ta=doors.reduce((s,d)=>s+(parseFloat(d.w)||0)*(parseFloat(d.h)||0),0);
  set("ft_da",ta>0?ta.toFixed(2)+' م²':''); set("ft_dp",cl.dt>0?cl.dt.toLocaleString("fa-IR"):'');
  set("ft_ap",cl.at>0?cl.at.toLocaleString("fa-IR"):'');
}

function subInv(){
  const cn=(elv("f_cn")||"").trim(), cp=(elv("f_cp")||"").trim();
  if(!cn||!cp){alert("لطفاً نام و موبایل مشتری را وارد کنید");return;}
  const date=elv("f_date")||nowFa(), notes=elv("f_notes")||"";
  const cust=getOrCreateCust(cn,cp);
  const doors=DOORS.map(d=>{
    const pid=elv("dp_"+d.id)||d.pid, cid=elv("dc_"+d.id)||d.cid;
    const w=elv("dw_"+d.id)||d.w, h=elv("dh_"+d.id)||d.h;
    const pr=P.products.find(p=>p.id===pid), col=P.colors.find(c=>c.id===cid);
    const a=(parseFloat(w)||0)*(parseFloat(h)||0);
    return{pid,cid,rt:d.rt,w,h,pname:pr?.name||"",colName:col?.name||"",area:a,price:a*(pr?.ppm||0)};
  });
  const accs=ACCS.map(a=>{
    const aid=elv("aa_"+a.id)||a.aid, qty=elv("aq_"+a.id)||a.qty;
    const tp=P.accTypes.find(t=>t.id===aid);
    return{aid,qty,aname:tp?.name||"",unit:tp?.unit||"",price:(parseFloat(qty)||0)*(tp?.ppu||0)};
  }).filter(a=>a.aid&&parseFloat(a.qty)>0);
  const cl=calcTotals(doors,ACCS.map(a=>({aid:elv("aa_"+a.id)||a.aid,qty:elv("aq_"+a.id)||a.qty})));
  const inv={id:uid(),num:nextN(),date,custId:cust.id,cust:{nm:cn,ph:cp},doors,accs,notes,c:cl,pays:[],status:"pend"};
  INV.push(inv); sv();
  go("detail",inv.id);
}

/* ── CUSTOMER AUTOCOMPLETE ── */
let acIdx = -1;

function getCustomers(){
  // Build unique customer list from invoices
  const map = {};
  INV.forEach(inv=>{
    const ph = inv.cust?.ph||"";
    if(!ph) return;
    if(!map[ph]){
      map[ph] = {nm:inv.cust?.nm||"", ph, count:0, lastDate:inv.date||""};
    }
    map[ph].count++;
    map[ph].lastDate = inv.date||map[ph].lastDate;
  });
  return Object.values(map).sort((a,b)=>b.count-a.count);
}

function acSearch(val){
  const list = document.getElementById("acList");
  if(!list) return;
  const all = getCustomers();
  const q = val.trim();
  const filtered = q.length===0 ? all : all.filter(c=>
    c.nm.includes(q) || c.ph.includes(q)
  );
  if(filtered.length===0){ list.style.display="none"; return; }
  acIdx = -1;
  list.innerHTML = filtered.slice(0,8).map((c,i)=>`
    <div class="ac-item" id="aci_${i}" onclick="acPick('${c.nm.replace(/'/g,"\\'")}','${c.ph}')">
      <span class="ac-name">${highlight(c.nm,q)}</span>
      <span class="ac-ph">📱 ${c.ph}</span>
      <span class="ac-badge">📄 ${c.count} فاکتور | آخرین: ${c.lastDate}</span>
    </div>`).join("");
  list.style.display="block";
}

function highlight(text, q){
  if(!q) return text;
  return text.replace(new RegExp(q,"g"), m=>`<mark style="background:#bfdbfe;border-radius:3px;padding:0 2px">${m}</mark>`);
}

function acPick(nm, ph){
  const inp = document.getElementById("f_cn");
  const ph_inp = document.getElementById("f_cp");
  if(inp) inp.value = nm;
  if(ph_inp) ph_inp.value = ph;
  acClose();
}

function acClose(){
  const list = document.getElementById("acList");
  if(list) list.style.display="none";
  acIdx = -1;
}

function acKey(e){
  const list = document.getElementById("acList");
  if(!list || list.style.display==="none") return;
  const items = list.querySelectorAll(".ac-item");
  if(e.key==="ArrowDown"){ e.preventDefault(); acIdx=Math.min(acIdx+1,items.length-1); acHighlight(items); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); acIdx=Math.max(acIdx-1,-1); acHighlight(items); }
  else if(e.key==="Enter" && acIdx>=0){ e.preventDefault(); items[acIdx]?.click(); }
  else if(e.key==="Escape"){ acClose(); }
}

function acHighlight(items){
  items.forEach((el,i)=>el.classList.toggle("sel",i===acIdx));
  if(acIdx>=0) items[acIdx]?.scrollIntoView({block:"nearest"});
}

function afterRender(){
  // close autocomplete on outside click
  document.addEventListener("click", function(e){
    if(!e.target.closest("#cnWrap")) acClose();
  }, {once:true});
  // update header date
  const hd = document.getElementById("hdrDate");
  if(hd) hd.textContent = "📅 " + nowFa();
  const ci=document.getElementById("cin");
  if(ci){
    ci.value=CHAT_IN;
    ci.addEventListener("input",e=>CHAT_IN=e.target.value);
    ci.addEventListener("keydown",e=>{if(e.key==="Enter"&&!AI_ON)sendChat();});
  }
  const cb=document.getElementById("chatbox"); if(cb) cb.scrollTop=cb.scrollHeight;
  if(PAGE==="new") setTimeout(updSum,50);
}

/* ══════════════════════ AI */
async function sendChat(){
  const inp=document.getElementById("cin");
  const txt=(inp?.value||CHAT_IN||"").trim();
  if(!txt||AI_ON) return;
  CHAT.push({r:"user",t:txt}); CHAT_IN=""; if(inp) inp.value="";
  AI_ON=true; refreshChat();
  await callAI(txt);
}
function refreshChat(){
  const cb=document.getElementById("chatbox"); if(!cb) return;
  cb.innerHTML=CHAT.map(m=>`<div class="msg ${m.r==='ai'?'ai':'u'}"><div class="mav">${m.r==='ai'?'🤖':'👤'}</div><div class="mb">${m.t}</div></div>`).join("")
  +(AI_ON?`<div class="msg ai"><div class="mav">🤖</div><div class="mb"><div class="typing"><span></span><span></span><span></span></div></div></div>`:"");
  cb.scrollTop=cb.scrollHeight;
}
async function callAI(txt){
  const pL=P.products.map(i=>`${i.id}:${i.name}`).join("|");
  const cL=P.colors.map(c=>`${c.id}:${c.name}`).join("|");
  const aL=P.accTypes.map(a=>`${a.id}:${a.name}(${a.unit})`).join("|");
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:700,
        system:`منشی کرکره فولادی. محصولات:${pL} رنگ‌ها:${cL} متعلقات:${aL} rt:in=داخلی out=بیرونی
فقط JSON: {"reply":"پاسخ فارسی","d":{"cn":null,"cp":null,"doors":[{"pid":null,"cid":null,"rt":null,"w":null,"h":null}],"accs":[{"aid":null,"qty":null}],"notes":null}}`,
        messages:CHAT.slice(-8).map(m=>({role:m.r==='ai'?'assistant':'user',content:m.t}))})});
    const data=await res.json();
    const raw=(data.content||[]).map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
    const parsed=JSON.parse(raw), d=parsed.d||{};
    if(d.cn){const e=document.getElementById("f_cn");if(e)e.value=d.cn;}
    if(d.cp){const e=document.getElementById("f_cp");if(e)e.value=d.cp;}
    if(d.notes){const e=document.getElementById("f_notes");if(e)e.value=d.notes;}
    if(d.doors?.length) d.doors.forEach((dd,i)=>{
      if(!DOORS[i]) addDoor();
      const did=DOORS[i]?.id; if(!did) return;
      if(dd.pid){DOORS[i].pid=dd.pid;const e=document.getElementById("dp_"+did);if(e)e.value=dd.pid;}
      if(dd.cid){DOORS[i].cid=dd.cid;const e=document.getElementById("dc_"+did);if(e)e.value=dd.cid;}
      if(dd.rt) dSel(did,'rt',dd.rt);
      if(dd.w!=null){DOORS[i].w=String(dd.w);const e=document.getElementById("dw_"+did);if(e)e.value=dd.w;}
      if(dd.h!=null){DOORS[i].h=String(dd.h);const e=document.getElementById("dh_"+did);if(e)e.value=dd.h;}
      refreshDR(did);
    });
    if(d.accs?.length) d.accs.forEach((da,i)=>{
      if(!ACCS[i]) addAcc();
      const aid=ACCS[i]?.id; if(!aid) return;
      if(da.aid){ACCS[i].aid=da.aid;const e=document.getElementById("aa_"+aid);if(e){e.value=da.aid;const u=document.getElementById("au_"+aid);if(u)u.textContent=getUnit(da.aid);}}
      if(da.qty!=null){ACCS[i].qty=String(da.qty);const e=document.getElementById("aq_"+aid);if(e)e.value=da.qty;}
      refreshAR(aid);
    });
    CHAT.push({r:"ai",t:parsed.reply||"✅ ثبت شد"});
  }catch(e){CHAT.push({r:"ai",t:"⚠️ خطا در ارتباط."});}
  AI_ON=false; refreshChat(); updSum();
}

let recog=null;
function toggleRec(){if(REC==='rec'){stopRec();return;}startRec();}
function startRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showMicHelp();return;}
  recog=new SR(); recog.lang="fa-IR"; recog.interimResults=false; recog.continuous=false;
  recog.onresult=e=>{const txt=e.results[0][0].transcript;REC="idle";updMicBtn();CHAT.push({r:"user",t:txt});AI_ON=true;refreshChat();callAI(txt);};
  recog.onerror=err=>{REC="idle";updMicBtn();if(err.error==='not-allowed')showMicHelp();};
  recog.onend=()=>{if(REC==='rec'){REC="idle";updMicBtn();}};
  try{recog.start();REC="rec";updMicBtn();}catch(e){REC="idle";showMicHelp();}
}
function stopRec(){try{recog?.stop();}catch(e){}REC="idle";updMicBtn();}
function updMicBtn(){const mb=document.getElementById("micbtn");if(!mb)return;mb.className="micbtn"+(REC==='rec'?' rec':'');mb.innerHTML=REC==='rec'?'<div class="rpl"></div>⏹':'🎙️';}

function addPay(id){
  const amt=parseFloat(document.getElementById("pamt")?.value)||0;
  const note=document.getElementById("pnote")?.value||"";
  const date=document.getElementById("pdate")?.value||nowFa();
  if(!amt){alert("مبلغ را وارد کنید");return;}
  INV=INV.map(i=>i.id!==id?i:{...i,pays:[...(i.pays||[]),{id:uid(),amt,note,date}]});
  sv(); go("detail",id);
}
function delPay(invId,payId){
  if(!confirm("این پرداخت حذف شود؟")) return;
  INV=INV.map(i=>i.id!==invId?i:{...i,pays:(i.pays||[]).filter(p=>p.id!==payId)});
  sv(); go("detail",invId);
}
function editPay(invId,payId){
  const inv=INV.find(i=>i.id===invId); if(!inv) return;
  const pay=inv.pays?.find(p=>p.id===payId); if(!pay) return;
  const amt=prompt("مبلغ (تومان):",pay.amt); if(!amt) return;
  const note=prompt("توضیح:",pay.note||"");
  const date=prompt("تاریخ:",pay.date||nowFa());
  INV=INV.map(i=>i.id!==invId?i:{...i,pays:(i.pays||[]).map(p=>p.id!==payId?p:{...p,amt:parseFloat(amt)||p.amt,note:note||"",date:date||p.date})});
  sv(); go("detail",invId);
}

      <button class="ctab${CTAB==='colors'?' on':''}"   data-tab="colors"   onclick="CTAB='colors';reCfg()">🎨<br>رنگ‌ها</button>
      <button class="ctab${CTAB==='print'?' on':''}"    data-tab="print"    onclick="CTAB='print';reCfg()">🖨️<br>چاپ</button>
    </div>
    <div class="cfg-body" id="cfgBody">${cfgBody()}</div>
  </div>`;
}

function cfgProducts(){
  return (P.products.length?P.products.map(it=>`
    <div class="card" style="padding:12px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-weight:700;font-size:13px">${it.name}</div>
          <div style="color:var(--go);font-size:12px;margin-top:2px">${fp(it.ppm)} / م²</div>
        </div>
        <div style="display:flex;gap:5px">
          <button class="btn bl" style="padding:6px 10px" onclick="edProd('${it.id}')">✏️</button>
          <button class="btn br" style="padding:6px 10px" onclick="delProd('${it.id}')">🗑️</button>
        </div>
      </div>
    </div>`).join(""):`<div class="empty" style="padding:15px"><div class="ei">📦</div>محصولی تعریف نشده</div>`)+`
  <div class="addbox"><div class="abt">➕ محصول جدید</div>
    <div class="f"><label class="lbl">نام محصول</label><input id="nPn" placeholder="مثلاً کرکره سه‌جداره..."></div>
    <div class="f"><label class="lbl">قیمت م² (تومان)</label><input type="number" inputmode="numeric" id="nPp" placeholder="۱۰۰۰۰۰۰"></div>
    <button class="btn bp bfull" onclick="addProd()" style="margin-top:4px">➕ افزودن</button>
  </div>`;
}

function cfgAccTypes(){
  return `<div style="font-size:12px;color:var(--dim);background:#f0f9ff;border-radius:9px;padding:10px;margin-bottom:10px;line-height:1.7">
    💡 متعلقاتی که اینجا تعریف می‌کنید در فرم فاکتور قابل انتخاب هستند.
  </div>`+
  (P.accTypes.length?P.accTypes.map(a=>`
    <div class="card" style="padding:12px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-weight:700;font-size:13px">${a.name}
            <span style="color:var(--dim);font-weight:400;font-size:11px;margin-right:5px">(${a.unit})</span>
          </div>
          <div style="color:var(--go);font-size:12px;margin-top:2px">${fp(a.ppu)} / ${a.unit}</div>
        </div>
        <div style="display:flex;gap:5px">
          <button class="btn bl" style="padding:6px 10px" onclick="edAcc('${a.id}')">✏️</button>
          <button class="btn br" style="padding:6px 10px" onclick="delAccType('${a.id}')">🗑️</button>
        </div>
      </div>
    </div>`).join(""):`<div class="empty" style="padding:15px"><div class="ei">🔧</div>متعلقاتی تعریف نشده</div>`)+`
  <div class="addbox"><div class="abt">➕ متعلقات جدید</div>
    <div class="f"><label class="lbl">نام</label><input id="nAn" placeholder="موتور برقی، قفل برقی، فنر..."></div>
    <div class="r2">
      <div class="f"><label class="lbl">واحد</label><input id="nAu" placeholder="متر / عدد / کیلو"></div>
      <div class="f"><label class="lbl">قیمت واحد (تومان)</label><input type="number" inputmode="numeric" id="nAp" placeholder="۱۰۰۰۰۰"></div>
    </div>
    <button class="btn bp bfull" onclick="addAccType()" style="margin-top:4px">➕ افزودن</button>
  </div>`;
}

function cfgColors(){
  return `<div style="font-size:12px;color:var(--dim);background:#f0f9ff;border-radius:9px;padding:10px;margin-bottom:10px;line-height:1.7">
    🎨 رنگ‌های تعریف‌شده در فرم فاکتور قابل انتخاب هستند.
  </div>`+
  (P.colors.length?P.colors.map(c=>`
    <div class="card" style="padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:${colorHex(c.name)};flex-shrink:0"></div>
        <span style="font-weight:600">🎨 ${c.name}</span>
      </div>
      <div style="display:flex;gap:5px">
        <button class="btn bl" style="padding:6px 10px" onclick="edCol('${c.id}')">✏️</button>
        <button class="btn br" style="padding:6px 10px" onclick="delCol('${c.id}')">🗑️</button>
      </div>
    </div>`).join(""):`<div class="empty" style="padding:15px"><div class="ei">🎨</div>رنگی تعریف نشده</div>`)+`
  <div class="addbox"><div class="abt">➕ رنگ جدید</div>
    <div class="f"><label class="lbl">نام رنگ</label><input id="nCol" placeholder="نقره‌ای، لاکی، زیتونی..."></div>
    <button class="btn bp bfull" onclick="addCol()">➕ افزودن</button>
  </div>`;
}

function cfgPrint(){
  if(!INV.length) return `<div class="empty"><div class="ei">📄</div>هنوز فاکتوری ثبت نشده</div>`;
  return `
  <div class="f"><label class="lbl">انتخاب فاکتور</label>
    <select id="printSel">
      <option value="">-- فاکتور را انتخاب کنید --</option>
      ${[...INV].reverse().map(i=>`<option value="${i.id}">فاکتور #${i.num} — ${i.cust?.nm} — ${i.date}</option>`).join("")}
    </select>
  </div>
  <button class="btn bpr bfull bbig" onclick="doPrintSel()" style="margin-top:8px">🖨️ چاپ / ذخیره PDF</button>
  <div style="font-size:11px;color:var(--dim);text-align:center;margin-top:10px;line-height:1.8">
    پنجره چاپ باز می‌شود — <b>Save as PDF</b> برای ذخیره
  </div>`;
}

function cfgFixed(){
  return `
  <div style="font-size:12px;color:var(--dim);background:#fffbeb;border-radius:9px;padding:10px;margin-bottom:10px;line-height:1.7">
    📌 این توضیحات به صورت خودکار در پایین هر فاکتور درج می‌شود.
  </div>
  ${P.fixedNotes.map((n,i)=>`
    <div class="card" style="padding:11px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px">
      <span style="font-size:13px;flex:1">${n}</span>
      <div style="display:flex;gap:5px;flex-shrink:0">
        <button class="btn bl" style="padding:6px 10px" onclick="edFixed(${i})">✏️</button>
        <button class="btn br" style="padding:6px 10px" onclick="delFixed(${i})">🗑️</button>
      </div>
    </div>`).join("")}
  <div class="addbox"><div class="abt">➕ توضیح ثابت جدید</div>
    <div class="f"><textarea id="nFixed" placeholder="متن توضیح را بنویسید..." style="height:60px"></textarea></div>
    <button class="btn bp bfull" onclick="addFixed()">➕ افزودن</button>
  </div>`;
}
function edFixed(i){
  const n=prompt("ویرایش:",P.fixedNotes[i]); if(n===null) return;
  P.fixedNotes[i]=n; sv(); reCfg();
}
function delFixed(i){
  if(!confirm("حذف شود؟")) return;
  P.fixedNotes.splice(i,1); sv(); reCfg();
}
function addFixed(){
  const n=document.getElementById("nFixed")?.value?.trim(); if(!n) return;
  P.fixedNotes.push(n); sv(); reCfg();
}

function doPrintSel(){
  const id=document.getElementById("printSel")?.value;
  if(!id){alert("یک فاکتور انتخاب کنید");return;}
  doPrint(id);
}


function colorHex(n){const m={"سفید":"#fff","کرم":"#f5f0e8","خاکستری":"#9ca3af","مشکی":"#1f2937","قهوه‌ای":"#78350f","آجری":"#b45309","نقره‌ای":"#c0c0c0","لاکی":"#dc2626","زیتونی":"#65a30d","آبی":"#3b82f6","سبز":"#059669"};return m[n]||"#e5e7eb";}
function edProd(id){const r=P.products.find(x=>x.id===id);if(!r)return;const n=prompt("نام:",r.name);if(n==null)return;const p=prompt("قیمت م²:",r.ppm);if(p==null)return;P.products=P.products.map(x=>x.id===id?{...x,name:n,ppm:parseFloat(p)||x.ppm}:x);sv();reCfg();}
function delProd(id){if(!confirm("حذف شود؟"))return;P.products=P.products.filter(x=>x.id!==id);sv();reCfg();}
function addProd(){const n=document.getElementById("nPn")?.value;const p=parseFloat(document.getElementById("nPp")?.value);if(!n||!p)return;P.products.push({id:"p"+uid(),name:n,ppm:p});sv();reCfg();}
function edAcc(id){const r=P.accTypes.find(x=>x.id===id);if(!r)return;const n=prompt("نام:",r.name);if(n==null)return;const u=prompt("واحد:",r.unit);if(u==null)return;const p=prompt("قیمت واحد:",r.ppu);if(p==null)return;P.accTypes=P.accTypes.map(x=>x.id===id?{...x,name:n,unit:u,ppu:parseFloat(p)||x.ppu}:x);sv();reCfg();}
function delAccType(id){if(!confirm("حذف شود؟"))return;P.accTypes=P.accTypes.filter(x=>x.id!==id);sv();reCfg();}
function addAccType(){const n=document.getElementById("nAn")?.value;const u=document.getElementById("nAu")?.value;const p=parseFloat(document.getElementById("nAp")?.value);if(!n||!u||!p)return;P.accTypes.push({id:"a"+uid(),name:n,unit:u,ppu:p});sv();reCfg();}
function edCol(id){const r=P.colors.find(x=>x.id===id);if(!r)return;const n=prompt("نام رنگ:",r.name);if(n==null)return;P.colors=P.colors.map(x=>x.id===id?{...x,name:n}:x);sv();reCfg();}
function addCol(){const n=document.getElementById("nCol")?.value;if(!n)return;P.colors.push({id:"c"+uid(),name:n});sv();reCfg();}
function delCol(id){if(!confirm("حذف شود؟"))return;P.colors=P.colors.filter(c=>c.id!==id);sv();reCfg();}

render();
</script>
</body>
</html>
